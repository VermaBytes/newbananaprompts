<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Check the free plan before building your resume</title>
  <desc id="desc">Three separate checks: editing access, file downloads, and AI access. Export a sample before entering personal details.</desc>
  <rect width="1200" height="675" fill="#102b35"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="66" fill="#75dfcf" font-size="19" letter-spacing="3">NB PROMPTS / APPLICATION CHECKLIST</text>
    <text x="60" y="129" fill="#fff" font-size="42" font-weight="700">Check the free plan before you build</text>
    <text x="60" y="171" fill="#c5d9df" font-size="24">Free editing, file downloads and AI access are separate decisions.</text>
    <g fill="#1c424f" stroke="#477080">
      <rect x="60" y="216" width="340" height="216" rx="16"/>
      <rect x="430" y="216" width="340" height="216" rx="16"/>
      <rect x="800" y="216" width="340" height="216" rx="16"/>
    </g>
    <g fill="#75dfcf" font-size="24" font-weight="700">
      <text x="86" y="259">01 / EDIT</text><text x="456" y="259">02 / DOWNLOAD</text><text x="826" y="259">03 / AI ACCESS</text>
    </g>
    <g fill="#fff" font-size="23">
      <text x="86" y="309">Is this template free?</text><text x="86" y="350">Any paid assets?</text><text x="86" y="391">Can I save a master?</text>
      <text x="456" y="309">Required file format?</text><text x="456" y="350">Export count or watermark?</text><text x="456" y="391">Can I revise and re-export?</text>
      <text x="826" y="309">Included or paid?</text><text x="826" y="350">Credits or provider setup?</text><text x="826" y="391">Can I finish without AI?</text>
    </g>
    <rect x="60" y="470" width="1080" height="119" rx="16" fill="#75dfcf"/>
    <text x="86" y="515" fill="#102b35" font-size="27" font-weight="700">Try a sample export with dummy text first.</text>
    <text x="86" y="555" fill="#102b35" font-size="23">Check the actual file before entering contact details or moving a full resume.</text>
    <text x="60" y="635" fill="#a4c0cb" font-size="18">Editorial decision guide • Not a product interface or a generated resume result</text>
  </g>
</svg>
